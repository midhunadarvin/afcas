/*
 * AFCAS application module — CLI (PicoCLI) + Web (Spring Boot).
 */

plugins {
    id 'java'
    id 'application'
    id 'org.springframework.boot' version '3.1.5'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'org.graalvm.buildtools.native' version '0.9.23'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group 'com.afcas'
version '1.0-SNAPSHOT'

// CLI entry point (application plugin / shadowJar / run)
def cliMainClass = 'com.afcas.AfcasApp'
// Web entry point (bootRun / bootJar)
def webMainClass = 'com.afcas.web.AfcasWebApplication'

application {
    mainClass.set(cliMainClass)
}

springBoot {
    mainClass = webMainClass
}

// Ensure bootRun always starts the web UI (not the PicoCLI main)
tasks.named('bootRun') {
    mainClass.set(webMainClass)
}

// Spring Boot's resolveMainClassName can pick up application.mainClass (CLI);
// pin the resolved property used by bootRun/bootJar.
tasks.named('resolveMainClassName') {
    configuredMainClassName = webMainClass
}

repositories {
    mavenCentral()
    gradlePluginPortal()
}

configurations {
    generateConfig
}

dependencies {
    // Spring Boot web stack
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Database (Maven coordinate; local copy under libs/ kept for reference only)
    implementation 'org.postgresql:postgresql:42.6.0'

    // CLI
    implementation 'com.google.guava:guava:31.1-jre'
    implementation 'info.picocli:picocli:4.7.4'
    generateConfig 'info.picocli:picocli-codegen:4.7.4'
    implementation 'info.picocli:picocli-shell-jline2:4.7.4'

    annotationProcessor 'info.picocli:picocli-codegen:4.7.4'
    annotationProcessor 'org.projectlombok:lombok'
    compileOnly 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // Tests (JUnit 4 + vintage for existing tests; Boot starter-test for platform)
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:3.+'
    testRuntimeOnly 'org.junit.vintage:junit-vintage-engine'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

// Plain JAR for libraries / non-Boot use (CLI main in manifest)
jar {
    enabled = true
    archiveClassifier.set('plain')
    manifest {
        attributes 'Main-Class': cliMainClass
    }
}

// Spring Boot executable JAR (web UI)
bootJar {
    archiveBaseName.set('afcas-web')
    archiveClassifier.set('')
    archiveVersion.set(project.version)
    mainClass.set(webMainClass)
}

// Fat CLI JAR (all deps, PicoCLI entry)
shadowJar {
    archiveBaseName.set('afcas')
    archiveClassifier.set('')
    archiveVersion.set('')
    mergeServiceFiles()
    manifest {
        attributes 'Main-Class': cliMainClass
    }
}

tasks.named('assemble') {
    dependsOn tasks.named('shadowJar')
}

graalvmNative {
    toolchainDetection = false
    metadataRepository {
        enabled = true
    }
    binaries {
        main {
            imageName.set('afcas')
            mainClass.set(cliMainClass)
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

// Dual entry points (CLI + Web): Spring AOT uses a single main class and conflicts
// with the PicoCLI application main. Disable AOT for JVM bootJar/bootRun.
// GraalVM nativeCompile still builds the CLI binary via graalvmNative { }.
tasks.matching { it.name == 'processAot' || it.name == 'processTestAot' }.configureEach {
    enabled = false
}
