# Server Configuration
server.port=8080

# Database Configuration (defaults for local development)
afcas.database.host=localhost
afcas.database.port=5432
afcas.database.username=postgres
afcas.database.password=123456

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Logging
logging.level.com.afcas=DEBUG
logging.level.org.springframework.web=INFO

# Database Schema Auto-Initialization
# When enabled, the web app will automatically create tables and procedures
# if they don't exist in the database (useful for fresh installations)
afcas.database.init.enabled=true
# The procedure name used to check if schema is already initialized
afcas.database.init.check-procedure=GetPrincipalList

# Authorization Engine Mode
# 'sql'  - Use PostgreSQL stored procedures (requires procedures installed in DB)
# 'java' - Use application-layer Java logic (portable, works with any DB)
afcas.engine.mode=sql
