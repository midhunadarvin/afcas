<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout :: head('Add Operation')}"></head>
<body class="app-body">
<div class="app-shell">
    <aside th:replace="~{layout :: sidebar}"></aside>
    <div class="app-main">
        <header th:replace="~{layout :: topbar('Add operation', 'Define a new action identifier')}"></header>
        <main class="app-content">
            <div class="container-fluid app-container">
                <div class="form-panel">
                    <div class="card card-elevated">
                        <div class="card-header"><h4><i class="bi bi-lightning-charge"></i> New operation</h4></div>
                        <div class="card-body">
                            <form th:action="@{/operations}" method="post">
                                <div class="mb-3">
                                    <label for="id" class="form-label">ID <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control table-mono" id="id" name="id" required placeholder="e.g. Edit">
                                </div>
                                <div class="mb-3">
                                    <label for="name" class="form-label">Name</label>
                                    <input type="text" class="form-control" id="name" name="name" placeholder="Display name">
                                </div>
                                <div class="mb-4">
                                    <label for="description" class="form-label">Description</label>
                                    <textarea class="form-control" id="description" name="description" rows="3"></textarea>
                                </div>
                                <div class="d-flex justify-content-between gap-2">
                                    <a href="/operations" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Cancel</a>
                                    <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Create operation</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <footer th:replace="~{layout :: footer}"></footer>
    </div>
</div>
<th:block th:replace="~{layout :: scripts}"></th:block>
</body>
</html>
