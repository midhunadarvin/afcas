<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout :: head('Principals')}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1><i class="bi bi-people"></i> Principals</h1>
        <a href="/principals/new" class="btn btn-primary">
            <i class="bi bi-plus-circle"></i> Add Principal
        </a>
    </div>

    <div th:if="${error}" class="alert alert-danger" role="alert">
        <span th:text="${error}"></span>
    </div>

    <div th:if="${success}" class="alert alert-success" role="alert">
        <span th:text="${success}"></span>
    </div>

    <div class="card">
        <div class="card-body">
            <table class="table table-striped table-hover">
                <thead>
                <tr>
                    <th>Name</th>
                    <th>Type</th>
                    <th>Email</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="principal : ${principals}">
                    <td th:text="${principal.name}">Name</td>
                    <td>
                        <span th:if="${principal.principalType.name() == 'User'}" class="badge bg-primary">
                            <i class="bi bi-person"></i> User
                        </span>
                        <span th:if="${principal.principalType.name() == 'Group'}" class="badge bg-secondary">
                            <i class="bi bi-people"></i> Group
                        </span>
                    </td>
                    <td th:text="${principal.email}">email</td>
                    <td>
                        <a th:href="@{/principals/{id}/members(id=${principal.id})}" class="btn btn-sm btn-outline-info" th:if="${principal.principalType.name() == 'Group'}">
                            <i class="bi bi-person-plus"></i> Members
                        </a>
                        <form th:action="@{/principals/{id}/delete(id=${principal.id})}" method="post" style="display:inline;" 
                              onsubmit="return confirm('Are you sure you want to delete this principal?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger">
                                <i class="bi bi-trash"></i> Delete
                            </button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(principals)}">
                    <td colspan="4" class="text-center text-muted">No principals found. Add one to get started.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<footer th:replace="~{layout :: footer}"></footer>
<th:block th:replace="~{layout :: scripts}"></th:block>
</body>
</html>
