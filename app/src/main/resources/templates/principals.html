<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout :: head('Principals')}"></head>
<body class="app-body">
<div class="app-shell">
    <aside th:replace="~{layout :: sidebar}"></aside>
    <div class="app-main">
        <header th:replace="~{layout :: topbar('Principals', 'Users and groups that hold permissions')}"></header>
        <main class="app-content">
            <div class="container-fluid app-container">
                <div class="page-header">
                    <div>
                        <h1 class="page-title"><i class="bi bi-people"></i> Principals</h1>
                        <p class="page-subtitle">Create users and groups, then nest members under groups for inherited access.</p>
                    </div>
                    <div class="page-actions">
                        <a href="/principals/new" class="btn btn-primary">
                            <i class="bi bi-plus-lg"></i> Add principal
                        </a>
                    </div>
                </div>

                <div th:if="${error}" class="alert alert-danger section-gap" role="alert">
                    <i class="bi bi-exclamation-triangle-fill"></i>
                    <span th:text="${error}"></span>
                </div>
                <div th:if="${success}" class="alert alert-success section-gap" role="alert">
                    <i class="bi bi-check-circle-fill"></i>
                    <span th:text="${success}"></span>
                </div>

                <div class="table-shell" th:if="${principals != null and !#lists.isEmpty(principals)}">
                    <table class="table table-hover">
                        <thead>
                        <tr>
                            <th>Name</th>
                            <th>Type</th>
                            <th>Email</th>
                            <th class="text-end">Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="principal : ${principals}">
                            <td>
                                <div class="fw-semibold" th:text="${principal.name}">Name</div>
                                <div class="text-muted small" th:if="${principal.displayName != null and !#strings.isEmpty(principal.displayName)}"
                                     th:text="${principal.displayName}"></div>
                            </td>
                            <td>
                                <span th:if="${principal.principalType.name() == 'User'}" class="badge bg-primary">
                                    <i class="bi bi-person"></i> User
                                </span>
                                <span th:if="${principal.principalType.name() == 'Group'}" class="badge bg-secondary">
                                    <i class="bi bi-people"></i> Group
                                </span>
                            </td>
                            <td class="text-muted" th:text="${principal.email != null and !#strings.isEmpty(principal.email) ? principal.email : '—'}">email</td>
                            <td>
                                <div class="actions-cell">
                                    <a th:href="@{/principals/{id}/members(id=${principal.id})}"
                                       class="btn btn-sm btn-outline-primary"
                                       th:if="${principal.principalType.name() == 'Group'}">
                                        <i class="bi bi-person-plus"></i> Members
                                    </a>
                                    <form th:action="@{/principals/{id}/delete(id=${principal.id})}" method="post" class="inline-form"
                                          onsubmit="return confirm('Delete this principal?');">
                                        <button type="submit" class="btn btn-sm btn-outline-danger">
                                            <i class="bi bi-trash"></i> Delete
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <div class="card" th:if="${principals == null or #lists.isEmpty(principals)}">
                    <div class="empty-state">
                        <div class="empty-state-icon"><i class="bi bi-people"></i></div>
                        <h3>No principals yet</h3>
                        <p>Add a user or group to start building your authorization model.</p>
                        <a href="/principals/new" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Add principal</a>
                    </div>
                </div>
            </div>
        </main>
        <footer th:replace="~{layout :: footer}"></footer>
    </div>
</div>
<th:block th:replace="~{layout :: scripts}"></th:block>
</body>
</html>
