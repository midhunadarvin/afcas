<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout :: head('Operations')}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1><i class="bi bi-gear"></i> Operations</h1>
        <a href="/operations/new" class="btn btn-success">
            <i class="bi bi-plus-circle"></i> Add Operation
        </a>
    </div>

    <div th:if="${error}" class="alert alert-danger" role="alert">
        <span th:text="${error}"></span>
    </div>

    <div th:if="${success}" class="alert alert-success" role="alert">
        <span th:text="${success}"></span>
    </div>

    <div class="card">
        <div class="card-body">
            <table class="table table-striped table-hover">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Description</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="operation : ${operations}">
                    <td th:text="${operation.id}">ID</td>
                    <td th:text="${operation.name}">Name</td>
                    <td th:text="${operation.description}">Description</td>
                    <td>
                        <form th:action="@{/operations/{id}/delete(id=${operation.id})}" method="post" style="display:inline;" 
                              onsubmit="return confirm('Are you sure you want to delete this operation?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger">
                                <i class="bi bi-trash"></i> Delete
                            </button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(operations)}">
                    <td colspan="4" class="text-center text-muted">No operations found. Add one to get started.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<footer th:replace="~{layout :: footer}"></footer>
<th:block th:replace="~{layout :: scripts}"></th:block>
</body>
</html>
