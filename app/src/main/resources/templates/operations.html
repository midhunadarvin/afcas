<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout :: head('Operations')}"></head>
<body class="app-body">
<div class="app-shell">
    <aside th:replace="~{layout :: sidebar}"></aside>
    <div class="app-main">
        <header th:replace="~{layout :: topbar('Operations', 'Actions that can be authorized on resources')}"></header>
        <main class="app-content">
            <div class="container-fluid app-container">
                <div class="page-header">
                    <div>
                        <h1 class="page-title"><i class="bi bi-lightning-charge"></i> Operations</h1>
                        <p class="page-subtitle">Define the action vocabulary for your authorization model.</p>
                    </div>
                    <div class="page-actions">
                        <a href="/operations/new" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Add operation</a>
                    </div>
                </div>

                <div th:if="${error}" class="alert alert-danger section-gap" role="alert">
                    <i class="bi bi-exclamation-triangle-fill"></i><span th:text="${error}"></span>
                </div>
                <div th:if="${success}" class="alert alert-success section-gap" role="alert">
                    <i class="bi bi-check-circle-fill"></i><span th:text="${success}"></span>
                </div>

                <div class="table-shell" th:if="${operations != null and !#lists.isEmpty(operations)}">
                    <table class="table table-hover">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Description</th>
                            <th class="text-end">Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="operation : ${operations}">
                            <td class="table-mono fw-semibold" th:text="${operation.id}">ID</td>
                            <td th:text="${operation.name}">Name</td>
                            <td class="text-muted" th:text="${operation.description != null and !#strings.isEmpty(operation.description) ? operation.description : '—'}">Desc</td>
                            <td>
                                <div class="actions-cell">
                                    <form th:action="@{/operations/{id}/delete(id=${operation.id})}" method="post" class="inline-form"
                                          onsubmit="return confirm('Delete this operation?');">
                                        <button type="submit" class="btn btn-sm btn-outline-danger">
                                            <i class="bi bi-trash"></i> Delete
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <div class="card" th:if="${operations == null or #lists.isEmpty(operations)}">
                    <div class="empty-state">
                        <div class="empty-state-icon"><i class="bi bi-lightning-charge"></i></div>
                        <h3>No operations yet</h3>
                        <p>Create operations like Read, Edit, or Delete to grant against resources.</p>
                        <a href="/operations/new" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Add operation</a>
                    </div>
                </div>
            </div>
        </main>
        <footer th:replace="~{layout :: footer}"></footer>
    </div>
</div>
<th:block th:replace="~{layout :: scripts}"></th:block>
</body>
</html>
