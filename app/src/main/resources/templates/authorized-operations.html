<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout :: head('Authorized Operations')}"></head>
<body class="app-body">
<div class="app-shell">
    <aside th:replace="~{layout :: sidebar}"></aside>
    <div class="app-main">
        <header th:replace="~{layout :: topbar('Authorized operations', 'Operations available for a principal on a resource')}"></header>
        <main class="app-content">
            <div class="container-fluid app-container">
                <div class="page-header">
                    <div>
                        <a href="/authorization" class="btn btn-secondary btn-sm mb-2"><i class="bi bi-arrow-left"></i> Back</a>
                        <h1 class="page-title"><i class="bi bi-lightning-charge"></i> Authorized operations</h1>
                    </div>
                </div>

                <div class="meta-chip-row">
                    <span class="meta-chip">Principal <strong th:text="${principalId}">p</strong></span>
                    <span class="meta-chip">Resource <strong th:text="${resourceId}">r</strong></span>
                </div>

                <div class="card" th:if="${operations != null and !#lists.isEmpty(operations)}">
                    <div class="card-body">
                        <ul class="soft-list">
                            <li class="soft-list-item" th:each="operation : ${operations}">
                                <i class="bi bi-lightning-charge"></i>
                                <div>
                                    <strong th:text="${operation.name != null ? operation.name : operation.id}">Op</strong>
                                    <div class="text-muted small table-mono" th:if="${operation.id != null}" th:text="${operation.id}"></div>
                                </div>
                            </li>
                        </ul>
                    </div>
                </div>

                <div class="card" th:if="${operations == null or #lists.isEmpty(operations)}">
                    <div class="empty-state">
                        <div class="empty-state-icon"><i class="bi bi-slash-circle"></i></div>
                        <h3>No authorized operations</h3>
                        <p>This principal cannot perform any known operations on the resource.</p>
                    </div>
                </div>
            </div>
        </main>
        <footer th:replace="~{layout :: footer}"></footer>
    </div>
</div>
<th:block th:replace="~{layout :: scripts}"></th:block>
</body>
</html>
