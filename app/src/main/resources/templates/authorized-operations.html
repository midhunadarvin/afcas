<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout :: head('Authorized Operations')}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<div class="container mt-4">
    <div class="mb-4">
        <a href="/authorization" class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i> Back to Authorization
        </a>
    </div>

    <h1 class="mb-4">
        <i class="bi bi-gear"></i> Authorized Operations
    </h1>

    <div class="alert alert-info">
        Principal: <strong th:text="${principalId}">Principal</strong><br>
        Resource: <strong th:text="${resourceId}">Resource</strong>
    </div>

    <div class="card">
        <div class="card-header">
            <h5 class="mb-0">Operations this principal can perform on the resource</h5>
        </div>
        <div class="card-body">
            <ul class="list-group" th:if="${!#lists.isEmpty(operations)}">
                <li class="list-group-item" th:each="operation : ${operations}">
                    <i class="bi bi-gear text-success"></i> 
                    <span th:text="${operation.name != null ? operation.name : operation.id}">Operation</span>
                </li>
            </ul>
            <div th:if="${#lists.isEmpty(operations)}" class="text-center text-muted py-4">
                No authorized operations found.
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{layout :: footer}"></footer>
<th:block th:replace="~{layout :: scripts}"></th:block>
</body>
</html>
