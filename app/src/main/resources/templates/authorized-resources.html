<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout :: head('Authorized Resources')}"></head>
<body class="app-body">
<div class="app-shell">
    <aside th:replace="~{layout :: sidebar}"></aside>
    <div class="app-main">
        <header th:replace="~{layout :: topbar('Authorized resources', 'Resources a principal can access with an operation')}"></header>
        <main class="app-content">
            <div class="container-fluid app-container">
                <div class="page-header">
                    <div>
                        <a href="/authorization" class="btn btn-secondary btn-sm mb-2"><i class="bi bi-arrow-left"></i> Back</a>
                        <h1 class="page-title"><i class="bi bi-box"></i> Authorized resources</h1>
                    </div>
                </div>

                <div class="meta-chip-row">
                    <span class="meta-chip">Principal <strong th:text="${principalId}">p</strong></span>
                    <span class="meta-chip">Operation <strong th:text="${operationId}">o</strong></span>
                </div>

                <div class="card" th:if="${resources != null and !#lists.isEmpty(resources)}">
                    <div class="card-body">
                        <ul class="soft-list">
                            <li class="soft-list-item" th:each="resource : ${resources}">
                                <i class="bi bi-box" style="color:var(--warning)"></i>
                                <div>
                                    <strong th:text="${resource.name != null ? resource.name : resource.id}">Resource</strong>
                                    <div class="text-muted small table-mono" th:if="${resource.id != null}" th:text="${resource.id}"></div>
                                </div>
                            </li>
                        </ul>
                    </div>
                </div>

                <div class="card" th:if="${resources == null or #lists.isEmpty(resources)}">
                    <div class="empty-state">
                        <div class="empty-state-icon"><i class="bi bi-folder-x"></i></div>
                        <h3>No authorized resources</h3>
                        <p>No resources are reachable for this principal and operation.</p>
                    </div>
                </div>
            </div>
        </main>
        <footer th:replace="~{layout :: footer}"></footer>
    </div>
</div>
<th:block th:replace="~{layout :: scripts}"></th:block>
</body>
</html>
