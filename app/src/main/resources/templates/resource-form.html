<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout :: head('Add Resource')}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h4 class="mb-0"><i class="bi bi-folder-plus"></i> Add New Resource</h4>
                </div>
                <div class="card-body">
                    <form th:action="@{/resources}" method="post">
                        <div class="mb-3">
                            <label for="id" class="form-label">ID <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="id" name="id" required placeholder="e.g., Workspace, Document123">
                            <div class="form-text">Unique identifier for the resource.</div>
                        </div>
                        <div class="mb-3">
                            <label for="name" class="form-label">Name</label>
                            <input type="text" class="form-control" id="name" name="name" placeholder="Display name">
                            <div class="form-text">Human-readable name for the resource.</div>
                        </div>
                        <div class="d-flex justify-content-between">
                            <a href="/resources" class="btn btn-secondary">
                                <i class="bi bi-arrow-left"></i> Cancel
                            </a>
                            <button type="submit" class="btn btn-success">
                                <i class="bi bi-check-circle"></i> Create Resource
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{layout :: footer}"></footer>
<th:block th:replace="~{layout :: scripts}"></th:block>
</body>
</html>
